# One-compartment PK with first-order absorption, effect-site link, Emax readouts. DT = 1 s.
dt_s: 1.0
variants:
  dev:
    typical:        {ka_half_min: 2.5, ke_half_min: 150, keo_half_min: 1.0, Emax: 1.0, EC50: 1.0, HRmax: 25.0, EC50_hr: 1.5}
    fast_absorber:  {ka_half_min: 1.0, ke_half_min: 120, keo_half_min: 0.5, Emax: 1.0, EC50: 0.8, HRmax: 30.0, EC50_hr: 1.0}
    slow_eliminator: {ka_half_min: 4.0, ke_half_min: 300, keo_half_min: 2.0, Emax: 1.0, EC50: 1.2, HRmax: 20.0, EC50_hr: 2.0}
  heldout:
    extreme_fast:   {ka_half_min: 0.5, ke_half_min: 90,  keo_half_min: 0.25, Emax: 1.0, EC50: 0.2, HRmax: 40.0, EC50_hr: 0.5}
    extreme_slow:   {ka_half_min: 6.0, ke_half_min: 600, keo_half_min: 4.0, Emax: 1.0, EC50: 2.5, HRmax: 15.0, EC50_hr: 3.0}
    slow_link:      {ka_half_min: 2.0, ke_half_min: 200, keo_half_min: 10.0, Emax: 1.0, EC50: 1.0, HRmax: 60.0, EC50_hr: 1.0}
  heldout_v2:
    ultra_potent:   {ka_half_min: 0.75, ke_half_min: 100, keo_half_min: 0.5, Emax: 1.0, EC50: 0.1, HRmax: 50.0, EC50_hr: 0.3}
    weak_slow:      {ka_half_min: 8.0, ke_half_min: 480, keo_half_min: 3.0, Emax: 1.0, EC50: 4.0, HRmax: 10.0, EC50_hr: 6.0}
    slow_link_20:   {ka_half_min: 2.5, ke_half_min: 180, keo_half_min: 20.0, Emax: 1.0, EC50: 0.6, HRmax: 35.0, EC50_hr: 0.9}
