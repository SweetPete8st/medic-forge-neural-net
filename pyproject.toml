[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medic-forge-neural-net"
version = "0.1.0"
description = "Custom, repeatable patient models for Medic Forge EMS education: specification, code and weight compile targets, and experiments."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11"]
torch = ["torch>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
